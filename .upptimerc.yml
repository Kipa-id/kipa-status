# Status page status.kipa.id (spec 053, Upptime per D104). Monitors per contract §4.1:
# M1 and M2 since spec 053; the production rows of spec 081 C81 §13.2 added 2026-11-26 (Kipa Admin is
# watched by GlitchTip instead, O081.16). Until go-live they sit inside the scheduled maintenance issue.
# Staging hosts are not monitored here (this repository is public).
owner: Kipa-id
repo: kipa-status
user-agent: kipa-status

secrets: []

sites:
  - name: Situs kipa.id
    url: https://kipa.id/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Pusat bantuan
    url: https://help.kipa.id/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa POS
    slug: kipa-pos
    url: https://app.kipa.id/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa POS API
    slug: kipa-pos-api
    url: https://api.kipa.id/api/v1/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Berkas Kipa POS
    slug: berkas-kipa-pos
    url: https://files.kipa.id/kipa-pos/healthcheck.txt
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa Cuan
    slug: kipa-cuan
    url: https://cuan.kipa.id/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa Cuan API
    slug: kipa-cuan-api
    url: https://cuan.kipa.id/api/v1/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa Etalase
    slug: kipa-etalase
    url: https://store.kipa.id/manage/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Kipa Etalase API
    slug: kipa-etalase-api
    url: https://store.kipa.id/api/v1/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

status-website:
  cname: status.kipa.id
  name: Status Layanan Kipa
  logoUrl: https://kipa.id/favicon.svg
  favicon: https://kipa.id/favicon-32.png
  faviconSvg: https://kipa.id/favicon.svg
  themeUrl: https://status.kipa.id/kipa-theme.css
  introTitle: "**Status Layanan Kipa**"
  introMessage: "Halaman ini menampilkan keadaan Kipa POS, Kipa Cuan, Kipa Etalase dan situs kipa.id, diperiksa otomatis setiap 5 menit. Ada kendala yang tidak tampil di sini? Hubungi Tim Kipa lewat WhatsApp 0899-9345-999 atau hello@kipa.id (Senin–Sabtu, 08.00–21.00 WIB)."
  navbar:
    - title: Status
      href: /
    - title: kipa.id
      href: https://kipa.id/
    - title: Hubungi Tim Kipa
      href: https://kipa.id/kontak/

